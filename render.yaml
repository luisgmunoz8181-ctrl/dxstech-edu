services:
  - type: web
    name: dxstech-edu
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
    healthCheckPath: /api/health
